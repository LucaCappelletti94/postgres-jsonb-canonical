name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # The fuzz targets are a separate workspace and are not reached by the command above.
      - run: cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # testcontainers pulls an image the first time a container is created, which puts a
      # network operation inside the test. A transient registry error then surfaces as an
      # opaque testcontainers failure and loses the whole run, which has already happened
      # once with `bytes remaining on stream` on postgres:15. Pulling up front with a
      # bounded retry turns a blip into a retried step.
      - name: Pre-pull the PostgreSQL images
        run: |
          for tag in 14 15 16 17 18; do
            for attempt in 1 2 3; do
              if docker pull --quiet "postgres:$tag"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::could not pull postgres:$tag after 3 attempts"
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done
      # The differential suite starts PostgreSQL 14 through 18 through testcontainers, so
      # this job needs the Docker daemon the runner already provides. Release, because a
      # debug build of the 131072-digit cases is an order of magnitude slower.
      - run: cargo test --release --all-features

  targets:
    name: target ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Host, to prove the crate itself needs nothing from std.
          - x86_64-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-wasip1
          # 32-bit, which exercises every usize-to-u32 length conversion.
          - riscv32imac-unknown-none-elf
          # Big-endian, because the format fixes an endianness rather than inheriting one.
          - powerpc64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check --lib --no-default-features --target ${{ matrix.target }}

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match `rust-version` in Cargo.toml. 1.81 is where `core::error::Error`
      # stabilized, which `thiserror` 2 needs to work without std.
      - uses: dtolnay/rust-toolchain@1.81.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --no-default-features

  big-endian:
    name: big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: s390x
      # Same reasoning as the pre-pull in the test job: keep the network operation out of
      # the step whose failure would be read as a big-endian problem.
      - name: Pre-pull the s390x toolchain image
        run: |
          for attempt in 1 2 3; do
            if docker pull --quiet --platform linux/s390x rust:1-slim; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not pull rust:1-slim for s390x after 3 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      # A cross-build only proves the code compiles. Running the byte vectors on a real
      # big-endian target is what proves the encoding does not inherit host endianness.
      - name: Run the byte vectors on s390x
        run: |
          docker run --rm --platform linux/s390x \
            -v "$PWD":/src:ro -w /work -e CARGO_TERM_COLOR=always \
            rust:1-slim bash -c '
              cp -r /src/src /src/tests /src/benches /src/Cargo.toml /src/README.md /work/
              cargo test --release --test golden --test contract
            '

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Branch coverage needs nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The differential suite is deliberately absent from this list. It is the only suite
      # that needs PostgreSQL, and running it here pulled five images a second time on
      # every push, doubling both the work and the exposure to a flaky registry, which
      # went red once. Measured on 2026-08-28, it contributes no coverage the other suites
      # do not already give: 97.05 percent of regions with it and 97.05 percent without,
      # identical to the digit in every column. The `test` job still runs it as the gate.
      #
      # A new test suite has to be added here or it will not be measured.
      - name: Measure
        run: |
          cargo llvm-cov --release --branch \
            --lib --test golden --test contract --test properties \
            --test allocations --test legacy_append_json --test oracle \
            --ignore-filename-regex '^(tests|benches|fuzz)/' \
            --lcov --output-path lcov.info
          cargo llvm-cov report --release --branch \
            --ignore-filename-regex '^(tests|benches|fuzz)/' \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo deny check
      - run: cargo audit --deny warnings

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"
      # Enough to catch a target that no longer builds or that breaks immediately. The
      # real campaigns run in the scheduled workflow.
      # `--target` is pinned because `taiki-e/install-action` ships a musl-built
      # `cargo-fuzz`, which then defaults its own builds to musl, where AddressSanitizer
      # cannot link against a static libc.
      - name: Run each target briefly
        run: |
          for target in encode_deterministic equivalence_encoding number_spellings \
                        object_permutations encode_into_rollback deep_and_wide \
                        postgres_oracle; do
            echo "::group::$target"
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu \
              -- -max_total_time=30 -rss_limit_mb=4096
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
