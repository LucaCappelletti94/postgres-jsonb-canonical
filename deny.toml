[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
# Exactly the licenses the graph carries, dev-dependencies included, so an unexpected one
# fails rather than sliding under a broad allowance. Unicode-3.0 arrives through the ICU
# stack that `testcontainers` pulls in.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
