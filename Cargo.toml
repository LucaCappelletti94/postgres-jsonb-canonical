[package]
name = "postgres-jsonb-canonical"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Canonical encoding and equality for PostgreSQL jsonb values."
repository = "https://github.com/LucaCappelletti94/postgres-jsonb-canonical"
readme = "README.md"
keywords = ["postgresql", "jsonb", "canonical", "equality", "no-std"]
categories = ["database", "encoding", "no-std"]
# An allowlist, because the working tree collects generated directories and cargo only
# consults `.gitignore` once the manifest is tracked.
include = [
    "/src",
    "/tests",
    "/benches",
    "/README.md",
    "/LICENSE",
    "/clippy.toml",
    "/oracle",
]

[dependencies]
serde_json = { version = "1", default-features = false, features = [
    "alloc",
    "arbitrary_precision",
] }
thiserror = { version = "2", default-features = false }

# Gated so the emulated big-endian job does not build them: cargo builds every
# dev-dependency for any test selection, and that cost it 65 minutes. The suites needing
# them carry the matching `#![cfg(target_endian = "little")]`.
[target.'cfg(target_endian = "little")'.dev-dependencies]
bigdecimal = { version = "0.4", default-features = false }
criterion = { version = "0.7", features = ["html_reports"] }
diesel = { version = "2", features = ["postgres", "serde_json"] }
dhat = "0.3"
proptest = "1"
# So `tests/legacy_append_json.rs` reproduces subql's encoder exactly, at its versions.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "blocking"] }

[features]
default = []

[[bench]]
name = "canonical"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
# `pub(crate)` in a private module reaches as far as `pub` but says what it means.
redundant_pub_crate = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
